<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Board · Lattice</title>
<meta name="description" content="A shared Lattice board. Draw, write, drop images. Edits merge without conflicts, even offline.">
<meta name="theme-color" content="#f8fafb">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://mftkwebfvmmtyqfkizcq.supabase.co" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght,BNCE,INFM@0,300..800,-100..100,0..100&family=Schibsted+Grotesk:wght@400..800&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/board.css">
</head>
<body class="board-page">

<main class="canvas" id="canvas" tabindex="-1" aria-label="Board canvas">
  <div class="world" id="world"></div>
  <div class="cursors" id="cursors" aria-hidden="true"></div>
  <div class="empty" id="empty" hidden>
    <p class="empty-title">This board is empty.</p>
    <p>Pick the pen and draw, or double-click to drop a note. Paste or drag in an image.</p>
  </div>
  <div class="drop" id="drop" hidden><p>Drop to add the image</p></div>
</main>

<header class="bar top-left">
  <a class="mark" href="/" aria-label="Lattice home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6.5 20.5c3-5.5 6.2-9.9 9.6-13.2M10 25.5c4.3-7 8.6-12.3 13-16M16.5 25.5c2.6-4 5.2-7.3 8-9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="25.5" cy="7" r="2.6" fill="var(--red)"/></svg>
  </a>
  <input class="title" id="title" value="Loading board…" aria-label="Board name" maxlength="80" spellcheck="false" disabled>
  <span class="status" id="status" data-s="loading" role="status"><i></i><span id="statusText">Loading</span></span>
</header>

<header class="bar top-right">
  <div class="peers" id="peers" aria-label="People on this board"></div>
  <button class="icon-btn" id="offlineBtn" type="button" aria-pressed="false" title="Go offline (test offline editing)"></button>
  <button class="btn primary small" id="shareBtn" type="button"></button>
  <div id="account"></div>
</header>

<div class="options" id="options" hidden role="toolbar" aria-label="Colour"></div>

<nav class="dock" id="dock" aria-label="Tools">
  <span class="dock-pill" id="dockPill" aria-hidden="true"></span>
</nav>

<div class="bar bottom-left">
  <div class="group">
    <button class="icon-btn" id="undoBtn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled></button>
    <button class="icon-btn" id="redoBtn" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled></button>
  </div>
  <div class="group">
    <button class="icon-btn" id="zoomOut" type="button" title="Zoom out (−)" aria-label="Zoom out"></button>
    <button class="zoom-label data" id="zoomLabel" type="button" title="Fit everything (Shift+1)">100%</button>
    <button class="icon-btn" id="zoomIn" type="button" title="Zoom in (+)" aria-label="Zoom in"></button>
  </div>
</div>

<div class="bar bottom-right">
  <span class="fingerprint" id="fingerprint" title="State fingerprint. Two screens showing the same code have exactly the same board.">
    <span class="swatches" id="fpSwatches"></span><span class="data" id="fpText">--------</span>
  </span>
  <span class="sync data" id="syncInfo"></span>
</div>

<input type="file" id="filePick" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>

<div class="fatal" id="fatal" hidden>
  <div>
    <h2 id="fatalTitle">This board doesn't exist.</h2>
    <p id="fatalText">The link may be mistyped, or the board was never created.</p>
    <a class="btn primary" href="/boards">Go to your boards</a>
  </div>
</div>

<script type="module" src="/js/app/board.js"></script>
</body>
</html>
